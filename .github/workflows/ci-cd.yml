name: CI/CD Todo App

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  build-test:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Build Docker
      run: docker compose build


    - name: Rodar testes
      run: docker compose run --rm app pytest
